# Rotozoom status page — powered by Upptime (runs on GitHub Actions, independent
# of our own Cloudflare/Supabase infra so it stays up when they don't).
owner: avs-dev-ledlightings
repo: rotozoom-status

# Auto-assign the incident issue Upptime opens on downtime, so the owner gets a
# GitHub notification the moment a service (e.g. the Worker Network coordinator)
# goes offline — instead of finding out by hand.
assignees:
  - avs-dev-ledlightings

sites:
  - name: Website
    url: https://rotozoom.com
  - name: Status API
    url: https://rotozoom.com/api/status
  - name: Licensing
    url: https://ttcrdwftrkdwcngqswrd.supabase.co/functions/v1/avs-connect-login
    method: POST
    body: "{}"
    headers:
      - "Content-Type: application/json"
    expectedStatusCodes:
      - 401
  - name: Supabase
    url: https://ttcrdwftrkdwcngqswrd.supabase.co/rest/v1/
    expectedStatusCodes:
      - 401
  - name: AI — Claude (Anthropic)
    url: https://api.anthropic.com/v1/models
    expectedStatusCodes:
      - 401
  - name: Embeddings — Voyage
    url: https://api.voyageai.com/v1/embeddings
    method: POST
    body: "{}"
    headers:
      - "Content-Type: application/json"
    expectedStatusCodes:
      - 400
      - 401
  - name: Worker Network
    # Cloud-AI background-removal coordinator, probed via rotozoom.com so the
    # underlying host stays out of this public repo. 200 = coordinator reachable;
    # /api/status returns 503 for this component when it's down.
    url: https://rotozoom.com/api/status?component=workers
    expectedStatusCodes:
      - 200
  - name: Payments — Stripe
    url: https://api.stripe.com/v1/balance
    expectedStatusCodes:
      - 401
  - name: Google Sign-in
    url: https://accounts.google.com/.well-known/openid-configuration

status-website:
  cname: status.rotozoom.com
  name: Rotozoom Status
  introTitle: "Rotozoom — Service Status"
  introMessage: "Live status and uptime history of Rotozoom and the services it depends on."
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://rotozoom.com
